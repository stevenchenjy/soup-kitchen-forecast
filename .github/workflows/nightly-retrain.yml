name: Nightly retrain

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain even if attendance has not changed"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-retrain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run nightly retraining
        run: |
          ARGS=(--all --trained-locations-file "$RUNNER_TEMP/nightly-retrained-locations.txt")
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi

          echo "Workflow event: ${{ github.event_name }}"
          echo "Force input: ${{ github.event.inputs.force }}"
          printf "Final retrain args:"
          printf " %q" "${ARGS[@]}"
          printf "\n"
          echo "Head SHA: $(git rev-parse HEAD)"
          echo "Branch/ref: ${{ github.ref }}"

          python scripts/nightly_retrain.py "${ARGS[@]}"

      - name: Stage trained models and artifacts
        run: |
          while IFS= read -r location_id; do
            [ -n "$location_id" ] || continue
            model_path="models/visitor_model_${location_id}.joblib"
            artifact_path="artifacts/$location_id"

            if [ ! -f "$model_path" ]; then
              echo "Expected trained model not found: $model_path"
              exit 1
            fi

            git add -f -- "$model_path"
            if [ "$location_id" = "ny_12550" ]; then
              previous_active_backup="models/backups/ny_12550_previous_active.joblib"
              if [ ! -f "$previous_active_backup" ]; then
                echo "Expected F6 previous-active backup not found: $previous_active_backup"
                exit 1
              fi
              git add -f -- "$previous_active_backup"
            fi
            if [ -d "$artifact_path" ]; then
              git add -f -- "$artifact_path/"
            fi
          done < "$RUNNER_TEMP/nightly-retrained-locations.txt"

          echo "Staged model/artifact changes:"
          git diff --cached --stat -- models artifacts

      - name: Validate trained model loading
        run: |
          mapfile -t MODEL_PATHS < <(
            {
              git diff --cached --name-only --diff-filter=AM -- models |
                grep '^models/visitor_model_.*\.joblib$' || true
              while IFS= read -r location_id; do
                [ -n "$location_id" ] || continue
                echo "models/visitor_model_${location_id}.joblib"
              done < "$RUNNER_TEMP/nightly-retrained-locations.txt"
            } | sort -u
          )

          if [ "${#MODEL_PATHS[@]}" -eq 0 ]; then
            echo "No trained or changed model files to validate."
            exit 0
          fi

          python - "${MODEL_PATHS[@]}" <<'PY'
          import sys
          from src.model_publication import validate_f6_package_file
          from src.predictor import VisitorPredictor

          for model_path in sys.argv[1:]:
              predictor = VisitorPredictor(model_path)
              if model_path == "models/visitor_model_ny_12550.joblib":
                  validate_f6_package_file(model_path)
                  if predictor.model_package_schema_version != 2:
                      raise RuntimeError("ny_12550 nightly publication is not schema v2")
              print(f"Validated {model_path}")
          PY

      - name: Run publication test gate
        run: |
          python -m pytest -q
          git diff --check
          git diff --cached --check

      - name: Commit updated models and artifacts
        run: |
          if git diff --cached --quiet -- models artifacts; then
            echo "No model or artifact changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update nightly trained models"
            git push origin main
          fi

      - name: Mark retrained locations published
        run: |
          python scripts/mark_retrain_published.py \
            --locations-file "$RUNNER_TEMP/nightly-retrained-locations.txt" \
            --commit-sha "$(git rev-parse HEAD)"
